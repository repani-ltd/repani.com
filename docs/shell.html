<!-- Load-bearing: these two tags make `go get repani.com/...` resolve.
     The module root is the repo root; every path under it (ascon, golay,
     lz4s, pica, fact) resolves through this one page because longer URLs
     404 here. Never remove or reword them. -->
<meta name="go-import" content="repani.com git https://github.com/repani-ltd/repani">
<meta name="go-source" content="repani.com https://github.com/repani-ltd/repani https://github.com/repani-ltd/repani/tree/main{/dir} https://github.com/repani-ltd/repani/blob/main{/dir}/{file}#L{line}">

<style>
  :root { --paper: #FEFAE0; --ink: #2B2D42; --muted: #6B7383; --red: #C1121F; --rule: #E3DFC8; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #14141F; --ink: #E8E8ED; --muted: #9AA3B5; --red: #FF6B7A; --rule: #2B2D42; }
  }
  html { background: var(--paper); }
  body { margin: 0 auto; padding: 2.5em 1.25em 3em; color: var(--ink);
         font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
         /* 64-column page: the type size follows the viewport so the measure never wraps. */
         font-size: clamp(9px, calc((100vw - 2.5rem) / 38.4), 15px); line-height: 1.45;
         width: 64ch; max-width: 100%; box-sizing: content-box; }
  header { display: flex; align-items: center; gap: .8em; margin-bottom: 2.2em; }
  header svg { width: 2.6em; height: 2.85em; flex: none; }
  header .name a { color: var(--ink); text-decoration: none; letter-spacing: .04em; }
  pre { margin: 0; font: inherit; white-space: pre; }
  a { color: var(--red); text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { margin-top: 2.5em; padding-top: 1em; border-top: 1px solid var(--rule); color: var(--muted); }
  footer a { color: var(--muted); text-decoration: underline; text-underline-offset: .15em; }
  footer a:hover { color: var(--ink); }
</style>
</head>
